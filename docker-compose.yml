services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: karaoke
      POSTGRES_PASSWORD: karaoke
      POSTGRES_DB: karaoke
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaoke -d karaoke"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://karaoke:karaoke@postgres:5432/karaoke?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_COLYSEUS_URL: ws://localhost:3001
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  pgdata:
